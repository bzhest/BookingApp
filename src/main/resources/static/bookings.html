            <li class="page-item disabled">

      <span class="page-link">

            </li>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="bookingOperations.js"></script>
<script src="userOperations.js"></script>
<script>
    $(document).ready(async function() {
        var itemsPerPage = 6;
        $.getJSON("/api/bookings", function(bookings) {
            var totalPages = Math.ceil(bookings.length / itemsPerPage);

            async function displayPage(pageNumber) {
                var start = (pageNumber - 1) * itemsPerPage;
                var end = start + itemsPerPage;
                var pageItems = bookings.slice(start, end);

                $('#bookingsContainer').empty();
                for (const booking of pageItems) {
                const buttonsHTML = await renderUserButtons(booking);
                    $('#bookingsContainer').append(
                        '<div class="col-md-4" id="booking-card-' + booking.id + '">' +
                        '<div class="card">' +
                        '<div class="card-body">' +
                        '<h5 class="card-title">' + booking.productTitle + '</h5>' +
                        '<p class="card-text"><strong>Date: </strong> ' + booking.date + '</p>' +
                        '<p class="card-text"><strong>Preferred Time: </strong> ' + booking.time + '</p>' +
                        '<p class="card-text"><strong>Delivery Address: </strong> ' + booking.deliveryAddress + '</p>' +
                        '<p class="card-text booking-status"><strong>Status: </strong> ' + booking.bookingStatusName + '</p>' +
                        '<div class="d-flex justify-content-between">' +  // Flexbox for button alignment
                           buttonsHTML +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</div>'
                    );
                };
            }

            try {
                   displayPage(1); // Call with await if needed in async context
            } catch (error) {
                    console.error("Failed to display booking page:", error);
    }

            // Populate pagination
            $('.pagination').empty();
            for (let i = 1; i <= totalPages; i++) {
                $('.pagination').append(
                    '<li class="page-item"><a class="page-link" href="#">' + i + '</a></li>'
                );
            }

            $('.page-link').click(function(e) {
                e.preventDefault();
                var pageNumber = parseInt($(this).text());
                displayPage(pageNumber);
            });
        });
    });

    function bookProduct(productId) {
        var bookingData = {
            product_id: productId,
            user_id: 3, // This should be dynamically fetched based on the logged-in user
            deliveryAddress: "1234 Test Address", // This might come from a form field or user profile
            booking_status: 1,
            quantity: 1 // This could be selected by the user
        };

        $.ajax({
            type: "POST",
            url: "/api/bookings",
            contentType: "application/json",
            data: JSON.stringify(bookingData),
            success: function(response) {
                alert("Product booked successfully!");
                // Assuming the response includes the booking ID and status ID
                var bookingId = response.id;
                var statusId = response.booking_status;
                $('#row-' + productId).data('bookingId', bookingId); // Store the bookingId in the row for later access
                fetchBookingStatus(productId, statusId);
            },
            error: function(response) {
                alert("Error booking product");
            }
        });
    }

    function fetchBookingStatus(productId, statusId) {
    var bookingId = $('#row-' + productId).data('bookingId');
    console.log("Product ID:", productId, "Status ID:", statusId, "Booking ID:", bookingId);
    $.getJSON("/api/bookings/" + statusId + "/status", function(response) {
    console.log("Received status:", response.status);  // Assuming response is { "status": "submitted" }
    $('#status-' + productId).text(response.status);
    if (response.status === "Submitted") {
            let buttonHTML = '<button onclick="cancelBooking(' + bookingId + ', ' + productId + ')">Cancel Booking</button>';
            $('#action-' + productId).html(buttonHTML);
        }
});
}


    // Keep the function definitions for bookProduct, cancelBooking, and fetchBookingStatus as is
</script>
</body>
