
variables:
  MYSQL_DATABASE: 'bookStore'
  MYSQL_ROOT_PASSWORD: 'admin'
  MYSQL_USER: 'root'
  MYSQL_PASSWORD: 'admin'

stages:
  - checkstyle
  - test_coverage_check
  - build
  - db
  - deploy
  - unit_tests
  - e2e_test


#############################################################JOBS#######################################################
checkstyle:
  stage: checkstyle
  script:
    - mvn checkstyle:check
  only:
    - development

test_coverage_check:
  stage: test_coverage_check
  script:
    - echo "Checking test coverage..."
    - mvn jacoco:report
  only:
    - development

build_job:
  stage: build
  image: maven:3.8.3-openjdk-17
  script:
    - echo "Building the application..."
    - mvn clean package -DskipTests # Example for a Maven Java project
  artifacts:
    paths:
      - target/*.jar

db:
  stage: db
  before_script:
      - echo "CREATE DATABASE IF NOT EXISTS bookStore; USE bookStore; CREATE TABLE IF NOT EXISTS books (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(255) NOT NULL);" | mysql --host=mysql --user=root --password=$MYSQL_ROOT_PASSWORD
  script:
      - mvn clean install -DskipTests
      - mvn spring-boot:run -Dspring-boot.run.arguments="--spring.datasource.url=jdbc:mysql://mysql:3306/bookStore?useSSL=false&serverTimezone=UTC --spring.datasource.username=root --spring.datasource.password=admin" &
      - sleep 30  # Give time for the application to start
      - mvn test
  services:
    - mysql:latest
  variables:
      MYSQL_DATABASE: 'bookStore'
      MYSQL_ROOT_PASSWORD: 'admin'

deploy_job:
  stage: deploy
  script:
    - echo "Deploying the application..."
    - java -jar target/bookStore-0.0.1-SNAPSHOT.jar & # Example for running a Java application
  artifacts:
    paths:
      - target/*.jar
  dependencies:
    - build_job

unit_tests:
  stage: unit_tests
  script:
    - echo "Running unit tests..."
    - mvn clean -Dtest=com.bookStore.tests.*Tests test
  only:
    - development

e2e_test:
  stage: e2e_test
  script:
    - echo "Building the project..."
    - mvn clean -Dtest=ui.*Tests test
  only:
    - development
